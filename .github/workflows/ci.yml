name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert jupyter

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute nz-support-ticket-analysis.ipynb --output executed_notebook.ipynb

      - name: Check output images exist
        run: |
          test -f feature_importance.png
          test -f ks_distribution.png
          test -f regional_analysis.png
          test -f roc_curve.png
